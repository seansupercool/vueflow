worker_processes 1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 8080;

    location /icp-dashboard/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /icp-dashboard/index.html;
    }

    location / {
      return 404;
    }
  }
}
